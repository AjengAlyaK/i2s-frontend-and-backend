<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pribadi Monitoring</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .page-title {
            margin-bottom: 2rem;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h1 class="text-center page-title">Data Pribadi Monitoring</h1>

        <!-- Search Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Search By</h5>
                <form id="searchForm" class="row g-3">
                    <div class="col-md-6">
                        <label for="searchNik" class="form-label">NIK</label>
                        <input type="text" class="form-control" id="searchNik" placeholder="Masukkan NIK">
                    </div>
                    <div class="col-md-6">
                        <label for="searchNama" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="searchNama" placeholder="Masukkan Nama Lengkap">
                    </div>
                    <div class="col-md-12 d-flex justify-content-between align-items-end mt-4">
                        <div>
                            <button type="submit" class="btn btn-primary me-2">Search</button>
                            <button type="reset" class="btn btn-outline-secondary">Reset</button>
                        </div>
                        <button type="button" class="btn btn-success" id="btnTambah">Tambah</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th>NIK</th>
                            <th>Nama Lengkap</th>
                            <th>Umur</th>
                            <th>Tanggal Lahir</th>
                            <th>Jenis Kelamin</th>
                            <th>Alamat</th>
                            <th>Negara</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="personTableBody">
                        <tr>
                            <td colspan="9" class="text-center text-muted py-4">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Konfirmasi Hapus</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Apakah Anda yakin ingin menghapus data dengan NIK <span id="deleteNikDisplay" class="fw-bold"></span>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="../js/api.js"></script>
    <script src="../js/monitoring.js"></script>
</body>
</html>
